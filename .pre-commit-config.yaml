repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
        require_serial: true
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        require_serial: true
      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
        require_serial: true
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        require_serial: true
        # Chỉ soi src/ cho khớp `make test` và CI. Chạy thêm trên tests/ và
        # examples/ sẽ dính R0801 (duplicate-code) do fixture/arrange lặp lại
        # giữa các test - điều bình thường và không đáng chặn commit.
        files: ^src/

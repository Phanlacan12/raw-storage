# Hạ tầng CHỈ DÙNG CHO PHÁT TRIỂN và PoC.
# Production theo docs/c4-06-deployment.md mục 6.6: ưu tiên dịch vụ S3-compatible
# sẵn có của tổ chức, và MinIO OSS bản cũ không dùng cho triển khai mới.
name: raw-storage-dev

# Dùng chung cho `openmetadata-migrate` và `openmetadata`: hai container phải trỏ vào
# cùng một database, lệch nhau thì migrate một nơi còn server đọc một nơi khác.
x-openmetadata-env: &openmetadata-env
  DB_HOST: mysql
  DB_PORT: "3306"
  OM_DATABASE: openmetadata_db
  DB_USER: openmetadata_user
  DB_USER_PASSWORD: ${MYSQL_PASSWORD:-openmetadata_password}
  SEARCH_TYPE: opensearch
  ELASTICSEARCH_HOST: opensearch
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: http
  AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
  AUTHENTICATION_PROVIDER: basic

services:
  mysql:
    image: mysql:8.0.35
    container_name: rs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: openmetadata_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openmetadata_password}
    command: --sort_buffer_size=10M --max_connections=300
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: rs-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "9200:9200"

  # OpenMetadata KHÔNG tự tạo schema. Khởi động khi database chưa migrate thì nó thoát
  # ngay với mã 1 kèm log `IllegalStateException: There are pending migrations`.
  # Service này chạy đúng một lần rồi kết thúc; server chỉ khởi động sau khi nó thành
  # công. Compose chính thức của OpenMetadata cũng tách bước này ra.
  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:1.12.0
    container_name: rs-openmetadata-migrate
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment: *openmetadata-env
    entrypoint: ["/bin/bash", "-c", "./bootstrap/openmetadata-ops.sh migrate"]

  openmetadata:
    image: docker.getcollate.io/openmetadata/server:1.12.0
    container_name: rs-openmetadata
    depends_on:
      mysql:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    environment: *openmetadata-env
    healthcheck:
      # Image openmetadata KHÔNG có curl (`/bin/sh: curl: not found`), nên healthcheck
      # cũ không bao giờ pass và container kẹt ở `health: starting` mãi mãi.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8586/healthcheck | grep -q healthy"]
      interval: 15s
      timeout: 10s
      retries: 40
    ports:
      - "8585:8585"
      - "8586:8586"

  # Object Storage tương thích S3 cho môi trường dev.
  # SeaweedFS được chọn vì còn được bảo trì và chỉ cần API S3 chuẩn.
  objectstore:
    image: chrislusf/seaweedfs:3.68
    container_name: rs-objectstore
    command: server -s3 -dir=/data -master.volumeSizeLimitMB=256
    volumes:
      - ./data/objectstore:/data
    healthcheck:
      # Phải dùng 127.0.0.1 chứ không phải localhost: busybox wget phân giải localhost
      # thành [::1], mà SeaweedFS chỉ lắng nghe IPv4 nên bị `Connection refused` và
      # container bị đánh `unhealthy` dù S3 vẫn phục vụ bình thường.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8333 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "8333:8333"
      - "9333:9333"

# Không khai báo `volumes:` nữa. Dữ liệu nằm ngay trong deploy/data/ để nhìn thấy và
# xoá được bằng tay, thay vì nằm trong vùng quản lý riêng của Docker.
# `make compose-down` vẫn dọn container; muốn xoá dữ liệu thì xoá deploy/data/.

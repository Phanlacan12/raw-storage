name: Document Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check line count
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking line count for each file"
          MAX_LINES=1000
          while IFS= read -r file; do
            base="$(basename "$file")"
            [[ "$base" =~ ^[Rr][Ee][Aa][Dd][Mm][Ee] ]] && continue
            line_count=$(wc -l < "$file")
            if [ "$line_count" -gt "$MAX_LINES" ]; then
              echo "::error file=$file::File $file has $line_count lines, over the $MAX_LINES limit."
              exit 1
            fi
          done < <(git ls-files | grep -v '^tests/' | grep -v '^docs/' | grep -v '\.ipynb$' | grep -v '^\.pylintrc$' | grep -v '\.lock$')

      - name: Check lines of code changes
        # Only meaningful on a pull request: on a push to main, HEAD and
        # origin/main are the same commit, so there is nothing to compare.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Raised while the foundation is still being built; lower it once
          # the codebase stabilises.
          MAX_CHANGE_LINES=5000
          BASE_BRANCH=main
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            PR_BASE=$(jq -r .pull_request.base.ref "$GITHUB_EVENT_PATH")
            BASE_BRANCH="${PR_BASE:-main}"
          fi
          echo "Comparing changes against '$BASE_BRANCH'"
          git fetch origin "$BASE_BRANCH" --depth=1 || true
          if git rev-parse "origin/$BASE_BRANCH" >/dev/null 2>&1; then
            DIFF_RANGE="origin/$BASE_BRANCH..HEAD"
          else
            DIFF_RANGE="HEAD^1..HEAD"
          fi
          # One awk, no grep: grep exits 1 when it matches nothing, which under
          # `set -o pipefail` fails the whole step on an empty diff. `+0` keeps
          # the output a number even when awk sees no rows at all.
          CHANGES=$(git diff --numstat "$DIFF_RANGE" \
            | awk '$3 !~ /\.ipynb$/ && $3 !~ /^docs\// && $3 !~ /\.lock$/ {added+=$1; deleted+=$2} END {print added+deleted+0}')
          if [ "$CHANGES" -gt "$MAX_CHANGE_LINES" ]; then
            echo "::error::Too many changes: $CHANGES lines. The maximum is $MAX_CHANGE_LINES."
            exit 1
          fi
          echo "Lines changed: ${CHANGES:-0}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Make test
        shell: bash
        run: |
          set -euo pipefail
          echo "--- isort ---"
          uv run isort --check-only --diff src tests examples setup.py
          echo "--- black ---"
          uv run black --check --diff src tests examples setup.py
          echo "--- mypy ---"
          uv run mypy src
          echo "--- pytest ---"
          uv run pytest -s --durations=0 --disable-warnings tests/ --cov=src --cov-report=xml
          echo "--- flake8 ---"
          uv run flake8 src tests examples setup.py
          echo "--- pylint ---"
          INCLUDED_FILES=$(find src -type f -name "*.py")
          echo "Running pylint on $(echo "$INCLUDED_FILES" | wc -w) files"
          uv run pylint $INCLUDED_FILES

      - name: Run examples
        shell: bash
        run: |
          set -euo pipefail
          # The examples run against the real code in src/, so this step catches
          # regressions the unit tests miss: container wiring, lifespan, and the
          # full path through HTTP.
          uv run python examples/run_all.py

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

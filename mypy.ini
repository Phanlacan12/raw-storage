# Theo khuôn Phanlacan12/CoreTrainingTimeSeries, bỏ follow_imports = skip
# vì ở project này mypy cần kiểm tra chính các port và model.
[mypy]
ignore_missing_imports = True
explicit_package_bases = True
plugins =
  pydantic.mypy
mypy_path = src
packages = document_service
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True

# Lõi nghiệp vụ check chặt hơn adapter.
[mypy-document_service.domain.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-document_service.application.*]
disallow_untyped_defs = True
warn_return_any = True

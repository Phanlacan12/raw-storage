# Theo khuôn Phanlacan12/CoreTrainingTimeSeries, line_length nâng lên 100 cho
# khớp .flake8 và [FORMAT] max-line-length trong .pylintrc.
[settings]
known_third_party = boto3,botocore,fastapi,httpx,moto,pydantic,pydantic_settings,pytest,respx,starlette,uvicorn,yaml
known_first_party = document_service
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip_glob = .venv/*,node_modules/*,build/*,dist/*
